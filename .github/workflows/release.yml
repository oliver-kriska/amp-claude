name: Release

on:
  push:
    tags: ["v*"]

# Read-only by default. The publishing job widens this for itself; nothing else
# in the run can write to the repository or mint a token.
permissions:
  contents: read

jobs:
  # A tag is a promise that the code at that commit is good. Nothing is built
  # until that promise is checked, because a bad release is far more expensive to
  # withdraw than a failed workflow is to re-run.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # `v*` matches `vibes` as happily as `v1.2.0`. Catch it here rather than
      # discovering it in the name of a published artefact.
      - name: Check the tag is a version
        run: |
          set -euo pipefail
          if ! printf '%s' "${GITHUB_REF_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'${GITHUB_REF_NAME}' is not a version tag (want vMAJOR.MINOR.PATCH, optionally -rc.1)"
            exit 1
          fi

      # A tag on a commit that never landed on main ships code nobody reviewed
      # and that the next release will silently drop.
      - name: Check the tag is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_SHA} is not an ancestor of origin/main — merge it before tagging"
            exit 1
          fi

      - uses: jdx/mise-action@v4
        with:
          version: 2026.8.14

      # GOBIN is set explicitly rather than trusting `go env GOPATH`: under mise
      # the Go toolchain is mise-managed, and the first cut of this step wrote a
      # GOPATH/bin to GITHUB_PATH that did not contain the binary — every run
      # since has failed at `make check` with "govulncheck missing". Naming the
      # directory ourselves means the same string is used to install and to find.
      - name: Install govulncheck
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gotools"
          GOBIN="$RUNNER_TEMP/gotools" go install golang.org/x/vuln/cmd/govulncheck@latest
          test -x "$RUNNER_TEMP/gotools/govulncheck"
          echo "$RUNNER_TEMP/gotools" >> "$GITHUB_PATH"

      # The same gate CI runs on every push. Running it again here is not
      # redundant: it is what makes the tag mean something on its own, without
      # having to go and look up whether main was green when it was cut.
      - run: make check

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release
      id-token: write       # mint the OIDC token provenance is signed with
      attestations: write   # record the attestation
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          version: 2026.8.14

      # Cross-compiling needs no cgo here: the module has no dependencies and
      # the bridge uses only the standard library.
      - name: Build every target
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            out="dist/amp-bridge_${os}_${arch}"
            GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.serverVersion=${version}" \
              -o "$out/amp-bridge" ./amp-bridge
            cp README.md LICENSE "$out/"
            tar -czf "dist/amp-bridge_${version}_${os}_${arch}.tar.gz" -C "$out" .
            rm -rf "$out"
          done
          cd dist && sha256sum ./*.tar.gz > checksums.txt

      # install.sh verifies downloads against this file, so a wrong checksum
      # makes every install fail in a way that looks like a compromised
      # download. Cheaper to catch here.
      - name: Verify the checksums
        run: cd dist && sha256sum -c checksums.txt

      # Unpack and run the artefact people will actually download, on the one
      # target this runner can execute. Proves three things at once: the tarball
      # is well-formed, the binary starts, and the plugin embedded in it comes
      # back out byte-identical to the source it was built from — which is the
      # half of the drift gate that only a real binary can answer.
      - name: Smoke-test the linux/amd64 artefact
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          tar -xzf "dist/amp-bridge_${GITHUB_REF_NAME}_linux_amd64.tar.gz" -C "$work"
          "$work/amp-bridge" --help > /dev/null

          # A typo in the -ldflags symbol path fails silently and ships a binary
          # that reports "dev" forever. Assert the stamp landed.
          got="$("$work/amp-bridge" --version)"
          echo "$got"
          case "$got" in
            "amp-bridge ${GITHUB_REF_NAME} "*) ;;
            *) echo "::error::version not stamped: got '$got'"; exit 1 ;;
          esac

          home="$(mktemp -d)"
          HOME="$home" XDG_CONFIG_HOME="$home/cfg" \
            "$work/amp-bridge" init --amp-plugin --global
          cmp "$home/cfg/amp/plugins/amp-bridge-inbox.ts" \
              amp-bridge/plugin/amp-bridge-inbox.ts
          echo "embedded plugin matches source"

      # Signed provenance for a binary people curl straight onto their PATH.
      # Verify with: gh attestation verify amp-bridge_*.tar.gz -R <owner>/<repo>
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes \
            dist/*.tar.gz dist/checksums.txt
