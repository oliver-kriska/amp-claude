name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The toolchain is pinned in .tool-versions; installing it the same way
      # locally and in CI is the point of pinning it at all.
      - uses: jdx/mise-action@v2
        with:
          version: 2026.8.1

      # Not pinned in .tool-versions because it is a checker rather than part of
      # the build: nothing it reports changes the artefact, and pinning it would
      # mean freezing the vulnerability database along with the tool.
      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # tidy, skill and plugin drift, TypeScript type-check against Amp's
      # published types, formatting, go vet on both build tags, 29 linters,
      # stdlib vulnerabilities, and both test tiers under -race. Same command a
      # contributor runs.
      - run: make check
